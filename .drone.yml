kind: pipeline
type: docker
name: build

workspace:
  path: /code

steps:
  - name: build-image
    image: plugins/docker
    settings:
      repo: t3hn3rd/asuro-build
      tags: ${DRONE_COMMIT}
      dockerfile: Dockerfile
      registry: docker.io
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password

  - name: compile-x86
    image: t3hn3rd/asuro-build:${DRONE_COMMIT}
    pull: always
    depends_on:
      - build-image
    commands:
      - git fetch --tags
      - |
        if [ "$DRONE_BRANCH" = "master" ]; then
          pwsh -NoLogo -NoProfile -File toolchain/build.ps1 all --arch x86 --profile release
        else
          pwsh -NoLogo -NoProfile -File toolchain/build.ps1 all --arch x86 --profile test:complex --testonly
        fi

  - name: compile-x86_64
    image: t3hn3rd/asuro-build:${DRONE_COMMIT}
    pull: always
    depends_on:
      - compile-x86
    commands:
      - git fetch --tags
      - |
        if [ "$DRONE_BRANCH" = "master" ]; then
          pwsh -NoLogo -NoProfile -File toolchain/build.ps1 all --arch x86_64 --profile release
        else
          pwsh -NoLogo -NoProfile -File toolchain/build.ps1 all --arch x86_64 --profile test:complex --testonly
        fi

  - name: run-tests-x86
    image: t3hn3rd/qemu-test-runner:latest
    pull: always
    depends_on:
      - compile-x86
    when:
      branch:
        - develop
        - feature/test-only-mode
    commands:
      - /usr/local/bin/run-tests --arch x86 /code/build/x86/test-complex-only/Asuro.iso

  - name: run-tests-x86_64
    image: t3hn3rd/qemu-test-runner:latest
    pull: always
    depends_on:
      - compile-x86_64
    when:
      branch:
        - develop
        - feature/test-only-mode
    commands:
      - /usr/local/bin/run-tests --arch x86_64 /code/build/x86_64/test-complex-only/Asuro.iso

  - name: upload-iso-artifact-x86
    image: alpine/git
    depends_on:
      - compile-x86
      - compile-x86_64
    when:
      event: [push]
      branch:
        - master
    environment:
      GITEA_TOKEN:
        from_secret: gitea_token
    commands:
      - apk add --no-cache curl
      - chmod +w build/x86/release/Asuro.iso
      - cp build/x86/release/Asuro.iso "Asuro_x86-$(git rev-parse --short HEAD).iso"
      - echo "Uploading Asuro_x86-$(git rev-parse --short HEAD).iso to Gitea Packages..."
      - |
         curl -X PUT "https://gitea.spexeah.com/api/packages/Spexeah/generic/asuro-iso/$(git rev-parse --short HEAD)/Asuro_x86.iso" \
         -H "Authorization: token $GITEA_TOKEN" --upload-file "Asuro_x86-$(git rev-parse --short HEAD).iso"
      - echo "Updating latest ISO reference..."
      - |
        curl -X DELETE https://gitea.spexeah.com/api/packages/Spexeah/generic/asuro-iso/latest/Asuro_x86.iso \
        -H "Authorization: token $GITEA_TOKEN" || echo "No previous latest version found."
      - |
        curl -X PUT https://gitea.spexeah.com/api/packages/Spexeah/generic/asuro-iso/latest/Asuro_x86.iso \
        -H "Authorization: token $GITEA_TOKEN" --upload-file "Asuro_x86-$(git rev-parse --short HEAD).iso"

  - name: upload-iso-artifact-x86_64
    image: alpine/git
    depends_on:
      - compile-x86_64
      - compile-x86
    when:
      event: [push]
      branch:
        - master
    environment:
      GITEA_TOKEN:
        from_secret: gitea_token
    commands:
      - apk add --no-cache curl
      - chmod +w build/x86_64/release/Asuro.iso
      - cp build/x86_64/release/Asuro.iso "Asuro_x86_64-$(git rev-parse --short HEAD).iso"
      - echo "Uploading Asuro_x86_64-$(git rev-parse --short HEAD).iso to Gitea Packages..."
      - |
         curl -X PUT "https://gitea.spexeah.com/api/packages/Spexeah/generic/asuro-iso/$(git rev-parse --short HEAD)/Asuro_x86_64.iso" \
         -H "Authorization: token $GITEA_TOKEN" --upload-file "Asuro_x86_64-$(git rev-parse --short HEAD).iso"
      - echo "Updating latest ISO reference..."
      - |
        curl -X DELETE https://gitea.spexeah.com/api/packages/Spexeah/generic/asuro-iso/latest/Asuro_x86_64.iso \
        -H "Authorization: token $GITEA_TOKEN" || echo "No previous latest version found."
      - |
        curl -X PUT https://gitea.spexeah.com/api/packages/Spexeah/generic/asuro-iso/latest/Asuro_x86_64.iso \
        -H "Authorization: token $GITEA_TOKEN" --upload-file "Asuro_x86_64-$(git rev-parse --short HEAD).iso"


  - name: deploy-docs
    image: alpine:latest
    depends_on:
      - compile-x86
      - compile-x86_64
    when:
      event: [push]
      branch:
        - master
        - develop
        - feature/mkdocs
    volumes:
      - name: docs-htdocs
        path: /htdocs
    commands:
      - apk add --no-cache rsync
      - |
        if [ "${DRONE_BRANCH}" = "master" ]; then
          DEST="/htdocs/master"
        else
          DEST="/htdocs/develop"
        fi
      - mkdir -p "$DEST"
      - rsync -a --delete build/docs/site/ "$DEST/"
      - echo "Documentation deployed to ${DRONE_BRANCH}"

  - name: msg-status
    image: appleboy/drone-discord
    failure: ignore
    depends_on:
      - run-tests-x86
      - run-tests-x86_64
      - upload-iso-artifact-x86
      - upload-iso-artifact-x86_64
      - deploy-docs
    when:
      status: [success, failure, changed]
    settings:
      webhook_id:
        from_secret: discord_webhook_id
      webhook_token:
        from_secret: discord_webhook_secret
      message: "**Asuro Build**\n\n{{#success build.status}}✅ Build successful!\n\n{{else}}❌ Build failed!\n\n{{/success}}Repository: `{{repo.namespace}}/{{repo.name}}`\nBranch: `{{commit.branch}}`\nCommit: `{{commit.sha}}`\nAuthor: `{{commit.author}} <{{commit.email}}>`\n\nGitea Diff: [Link](<{{commit.link}}>)\nDrone Build: [Link](<{{build.link}}>)\n\nMessage: {{commit.message}}"

volumes:
  - name: docs-htdocs
    host:
      path: /mnt/user/htdocs/asuro_docs
