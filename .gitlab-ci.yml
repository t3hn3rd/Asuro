.after_script:
  script: ./compile_check.sh "$CI_JOB_STATUS"
  artifacts:
    paths:
      - release/*.svg

stages:
  - chmod
  - compile_stub
  - vergen
  - compile_sources
  - link
  - isogen
  - finish

chmod_step:
  stage: chmod
  script: ls && chmod +x ./*.sh

compile_stub:
  stage: compile_stub
  script: ls && ./compile_stub.sh
      
vergen:
  stage: vergen
  script: ./compile_vergen.sh
  artifacts:
    paths:
      - release/*.svg

compile_sources:
  stage: compile_sources
  script: ./compile_sources.sh

link:
  stage: link
  script: ./compile_link.sh
  artifacts:
    paths:
      - bin/kernel.bin

isogen:
  stage: isogen
  script: ./compile_isogen.sh
  artifacts:
    paths:
      - ./Asuro.iso

finish:
  stage: finish
  script: ./compile_finish.sh "$CI_JOB_STATUS"
  artifacts:
    paths:
      - release/*.svg